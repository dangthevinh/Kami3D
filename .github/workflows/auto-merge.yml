name: Auto-merge

# Merges a dependency pull request automatically — but only after its checks
# actually pass, and only when it is safe to do so.
#
# Two gates, both explicit:
#   1. the `automerge` label. Dependabot PRs earn it only for patch and minor
#      updates, so a major version bump can never be merged here.
#   2. `gh pr checks --watch`, which blocks until CI reports green and fails the
#      job on red. Nothing merges on an unverified commit.
#
# Branch protection is deliberately NOT used as the gate: this repository pushes
# straight to main from scripts/publish.sh, and required status checks would
# block those direct pushes too.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  label-safe-updates:
    name: Label safe updates
    runs-on: ubuntu-latest
    # Skip the `labeled` re-entry so adding the label cannot loop.
    if: github.actor == 'dependabot[bot]' && github.event.action != 'labeled'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Label patch and minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label automerge

      - name: Comment on major updates instead
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PACKAGE: ${{ steps.meta.outputs.dependency-names }}
        run: |
          gh pr comment "$PR_URL" --body "**Major update to \`$PACKAGE\` — auto-merge is deliberately not enabled.**

          Major bumps change behaviour and usually need a migration (for example Next 16 replaced the `middleware`
          file convention with `proxy`, and removed the `eslint` key from `next.config.ts`). Run `npm run check` and
          `npm run build` on this branch, then label the PR `automerge` to merge it on green." || true

  merge-when-green:
    name: Merge when green
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The one gate: the label. No actor bypass, no package exception.
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    steps:
      - name: Wait for CI to report green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr checks "$PR_URL" --watch --interval 20 --fail-fast

      - name: Squash-merge and delete the branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
