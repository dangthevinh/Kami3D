name: CI

# Runs the full verification suite on every push and pull request. This is the
# gate that makes "build, test, then push" automatic: nothing reaches main
# without typecheck, the geometry/SQL check suites and a production build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, checks & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Node 24 runs the .ts check suites directly via type stripping.
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A glob, not a list: a new `check-*.mjs` suite is picked up by CI the moment
      # it exists, instead of waiting for somebody to remember to add it here.
      - name: Check suites
        run: npm run check:suites

      - name: Regenerate the seed and fail if it is out of date
        run: |
          npm run seed:generate
          git diff --exit-code supabase/seed.sql \
            || (echo "::error::supabase/seed.sql is stale — run 'npm run seed:generate' and commit the result." && exit 1)

      - name: Regenerate the geodata and fail if it is out of date
        run: |
          npm run geo:generate
          git diff --exit-code data/animal-geodata.json data/geodata-attribution.json \
            || (echo "::error::The bundled geodata is stale — run 'npm run geo:generate' and commit the result." && exit 1)

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://kami3d.example.com

      # Reads the HTML the build just produced and fails if any content route
      # grew past its JavaScript budget, or if three.js / an auth SDK crept back
      # into the first paint. See scripts/check-bundle.mjs.
      - name: Bundle budget
        run: npm run check:bundle
        env:
          NEXT_PUBLIC_SITE_URL: https://kami3d.example.com

  model-pipeline:
    name: Model fetch pipeline (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # No API tokens in CI on purpose: this proves the pipeline still works when
      # nothing is configured, and that it never downloads without a licence check.
      - name: Dry run against the live Sketchfab search API
        run: node scripts/fetch-models.mjs --report
